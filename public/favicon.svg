<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- near-black terminal panel, warm-gray hairline -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#000000" stroke="#2b2925" stroke-width="1.5" />
  <!-- stacked palette swatches: the token ramp stepping up to the amber accent -->
  <rect x="6" y="6" width="12" height="12" rx="3" fill="#3a362e" stroke="#000000" stroke-width="1" />
  <rect x="10" y="10" width="12" height="12" rx="3" fill="#8b8574" stroke="#000000" stroke-width="1" />
  <rect x="14" y="14" width="12" height="12" rx="3" fill="#ffb000" stroke="#000000" stroke-width="1" filter="url(#glow)" />
</svg>
